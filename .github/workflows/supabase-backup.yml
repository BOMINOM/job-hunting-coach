
name: Supabase Weekly Backup

on:
  schedule:
    # Every Sunday 02:00 UTC = Sunday 10:00 Beijing
    - cron: '0 2 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-weekly-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Backup Supabase Database
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check PostgreSQL 17 client
        run: |
          docker run --rm postgres:17 pg_dump --version

      - name: Backup and encrypt database
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSWORD: ${{ secrets.BACKUP_ENCRYPTION_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077

          # Check required secrets
          test -n "$DATABASE_URL"
          test -n "$BACKUP_PASSWORD"

          # Create temporary backup directory
          BACKUP_DIR="$RUNNER_TEMP/db-backup"
          mkdir -p "$BACKUP_DIR"

          # Remove temporary files when the step exits
          trap 'rm -f "$BACKUP_DIR/database.dump"' EXIT

          # Export database using PostgreSQL 17
          docker run --rm \
            --env DATABASE_URL \
            --volume "$BACKUP_DIR:/backup" \
            postgres:17 \
            pg_dump \
              --dbname="$DATABASE_URL" \
              --format=custom \
              --no-owner \
              --no-acl \
              --file=/backup/database.dump

          # Check that the backup exists
          test -s "$BACKUP_DIR/database.dump"

          # Encrypt backup before uploading
          openssl enc -aes-256-cbc \
            -pbkdf2 \
            -iter 600000 \
            -salt \
            -in "$BACKUP_DIR/database.dump" \
            -out "$BACKUP_DIR/database.dump.enc" \
            -pass env:BACKUP_PASSWORD

          # Delete unencrypted backup
          rm -f "$BACKUP_DIR/database.dump"

          # Verify encrypted file exists
          test -s "$BACKUP_DIR/database.dump.enc"

          echo "Encrypted database backup created."

      - name: Upload encrypted backup
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-${{ github.run_number }}
          path: ${{ runner.temp }}/db-backup/database.dump.enc
          retention-days: 30
          if-no-files-found: error
          compression-level: 0
